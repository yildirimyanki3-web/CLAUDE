# =============================================================================
# DNLSSM experiment configuration -- the single file that governs one run.
# =============================================================================
# Every field here maps 1:1 onto dnlssm.config.schema.ExperimentConfig.
# Change parameters here; no hyperparameter should ever need to be edited
# inside src/dnlssm/**.

runtime:
  experiment_name: dnlssm_baseline
  global_seed: 20240101
  output_root: experiments_output
  log_level: INFO
  n_jobs: 1

observation_space:
  target_frequency: MS          # month-start; the platform's common time grid
  start_date: "2005-01-01"
  end_date: null                # null = extend to the latest available observation

preprocessing:
  missing_data_method: linear_interpolate
  max_consecutive_missing_interpolate: 3
  seasonal_adjustment_method: stl
  standardization_method: zscore
  winsorize_lower_quantile: null
  winsorize_upper_quantile: null

model:
  latent_dim: 4
  transition_function:
    family: neural
    hidden_dim: 8
    polynomial_degree: 2
    activation: tanh
    weight_init_std: 0.1
  observation_function:
    family: neural
    hidden_dim: 8
    polynomial_degree: 2
    activation: tanh
    weight_init_std: 0.1
  process_noise:
    structure: diagonal
    init_std: 0.5
    regularization_epsilon: 1.0e-6
  observation_noise:
    structure: diagonal
    init_std: 0.5
    regularization_epsilon: 1.0e-6
  initial_state_mean: 0.0
  initial_state_std: 1.0

optimization:
  methods: ["L-BFGS-B", "Nelder-Mead"]
  n_multistarts: 8
  max_iterations: 500
  function_tolerance: 1.0e-8
  gradient_tolerance: 1.0e-5
  initial_param_scale: 0.5
  compute_hessian_ci: true
  hessian_step_size: 1.0e-4
  confidence_level: 0.95

particle_filter:
  n_particles: 4000
  resampling_method: systematic
  adaptive_resampling: true
  ess_threshold_ratio: 0.5
  smoother_method: backward_simulation
  smoother_n_backward_samples: 200
  fixed_lag_window: 10
  robustness_particle_counts: [2000, 3000, 4000, 5000]

model_selection:
  latent_dim_min: 3
  latent_dim_max: 8
  train_fraction: 0.8
  criteria_weights:
    aic: 0.25
    bic: 0.25
    oos_rmse: 0.25
    oos_mae: 0.25

diagnostics:
  significance_level: 0.05
  ljung_box_lags: 12
  acf_pacf_max_lags: 24
  arch_test_lags: 12
  observation_noise_alternatives: ["diagonal", "scalar", "full"]
